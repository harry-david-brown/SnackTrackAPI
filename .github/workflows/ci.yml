name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: snacktrack
          POSTGRES_PASSWORD: password
          POSTGRES_DB: snacktrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run build

      - name: Enforce architecture boundaries
        run: npm run check:architecture

      - name: Enforce core behavioral coverage
        run: npm run check:core-coverage

      - name: Enforce lint rules
        run: npm run lint

      - name: Enforce formatting
        run: npm run format:check

      - name: Run automated tests
        run: npm test
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://snacktrack:password@localhost:5432/snacktrack_test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (development)
        run: docker build -f Dockerfile.dev -t snack-track-api:dev .

      - name: Build Docker image (production)
        run: docker build -f Dockerfile -t snack-track-api:prod .

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run security audit
        run: npm audit --audit-level=moderate
