services:
  snack-track-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://snacktrack:password@postgres:5432/snacktrack_prod
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build: .
    command: node dist/scripts/migrate.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://snacktrack:password@postgres:5432/snacktrack_prod
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }

  market-history:
    build: .
    command: npm run start:market-history-scheduler
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://snacktrack:password@postgres:5432/snacktrack_prod
    env_file: [.env]
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=snacktrack_prod
      - POSTGRES_USER=snacktrack
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snacktrack -d snacktrack_prod"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_prod_data:
